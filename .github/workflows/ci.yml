name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ChangeMe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, sodium, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.example .env
          echo 'APP_ENV=test' >> .env
          echo 'DATABASE_URL="postgresql://app:ChangeMe@127.0.0.1:5432/app?serverVersion=16&charset=utf8"' >> .env
          echo 'MAILER_DSN=null://null' >> .env
          echo 'MAILER_FROM=noreply@waves.local' >> .env
          echo 'EMAIL_VERIFICATION_TOKEN_TTL=86400' >> .env
          echo 'JWT_SECRET=ci_jwt_secret_change_me_32_chars_min' >> .env
          echo 'JWT_ACCESS_TOKEN_TTL=900' >> .env
          echo 'JWT_REFRESH_TOKEN_TTL=2592000' >> .env
          echo 'S3_ENDPOINT=http://127.0.0.1:9000' >> .env
          echo 'S3_ACCESS_KEY=minio' >> .env
          echo 'S3_SECRET_KEY=minio123' >> .env
          echo 'S3_BUCKET=waves-profile-images' >> .env
          echo 'S3_REGION=us-east-1' >> .env

      - name: Create test database
        run: php bin/console doctrine:database:create --if-not-exists --env=test

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run PHPUnit
        run: php bin/phpunit
